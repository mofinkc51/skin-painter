name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check site files
        run: test -f site/index.html
      - name: Build default library index
        # bundles the library into one file per character (Pages cancels deploys over 10 min)
        run: node scripts/build-library.mjs site/library --pack
      - name: Site size
        run: echo "$(find site -type f | wc -l) files, $(du -sh site | cut -f1)"
      - uses: actions/configure-pages@v5
      # Name the artifact per attempt: a re-run keeps the same run_id and the
      # earlier attempt's artifact, which makes deploy-pages find two.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
